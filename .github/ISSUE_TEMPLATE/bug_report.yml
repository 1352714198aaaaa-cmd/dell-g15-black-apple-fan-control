name: Bug report
about: Something is broken
title: "[bug] "
labels: bug
body:
  - type: textarea
    id: what
    attributes: {label: What happened?}
    validations: {required: true}
  - type: textarea
    id: diag
    attributes: {label: fanctl diag output, render: shell}
  - type: input
    id: macos
    attributes: {label: macOS version}
  - type: input
    id: model
    attributes: {label: Laptop model}
