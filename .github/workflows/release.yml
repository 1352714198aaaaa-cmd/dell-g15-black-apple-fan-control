name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Install iasl
        run: brew install acpica
      - name: Build
        run: |
          ./kext/build.sh
          ./ssdt/build.sh
          ./app/build.sh
      - name: Package
        run: ./scripts/package-release.sh "${GITHUB_REF_NAME#v}"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: docs/RELEASE-NOTES-${{ github.ref_name }}.md
          files: |
            dist/FanCtl-v*.zip
            dist/FanCtl-v*.zip.sha256
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
