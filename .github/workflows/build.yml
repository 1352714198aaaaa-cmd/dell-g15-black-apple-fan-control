name: build
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Install iasl
        run: brew install acpica
      - name: Check Cask and launchd syntax
        run: |
          ruby -c Casks/g15-fanctl.rb
          plutil -lint docs/examples/*.plist
      - name: Build kext
        run: ./kext/build.sh
      - name: Build SSDT
        run: ./ssdt/build.sh
      - name: Build app
        run: ./app/build.sh
      - name: Package
        run: |
          mkdir -p dist
          cp -R kext/FanProbe.kext dist/
          cp ssdt/SSDT-FANEC.aml dist/
          cp -R app/FanCtl.app dist/
          cp cli/fanctl dist/
          cd dist && zip -r ../FanCtl.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: FanCtl
          path: FanCtl.zip
